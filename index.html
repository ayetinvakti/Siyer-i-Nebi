    <meta name="theme-color" content="#0f172a">

    <script>
        // Tema, özel renk paleti ve dil yönü (titremeyi önlemek için en başta çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0f172a'));

            // Dil yönü
            d.setAttribute('dir', (localStorage.getItem('user_lang') || 'tr') === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

        body {

        }

            flex-direction: column;
            align-items: center;

        .navbar {

            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;

        }

        }

        .nav-right-group {

            gap: 8px;
        }

        .home-btn, .theme-icon-btn {

            color: var(--text-color);

            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

            }
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.7rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        /* Arama Kutusu */

            width: 100%;
            margin-bottom: 15px;
        }

            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);

            font-size: 0.9rem;

            box-shadow: var(--shadow);
            user-select: text;
            -webkit-user-select: text;

            color: var(--text-muted);
        }

        /* Sekmeler / Kategoriler */
        .category-tabs {

            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;

        }

            color: #fff;
        }

        /* Konu Listesi Kartları */
        .content-list {

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

            flex-direction: column;
            gap: 6px;

        }

            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-color);

            align-items: center;
            justify-content: space-between;

            font-weight: 500;
            white-space: nowrap;

            overflow: hidden;

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .modal-sheet {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 40px 20px;
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 2;
        }

        .modal-title-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            padding-right: 10px;
        }

        [dir="rtl"] .modal-title-text {
            padding-right: 0;
            padding-left: 10px;
        }

        .close-modal-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .modal-body-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color);
            white-space: pre-line;
        }

        [dir="rtl"] .modal-body-text {
            line-height: 2;
            font-size: 1.02rem;
        }
    </style>
</head>

    // --- TEMA YÖNETİMİ ---
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Safari üst/alt çubuğu sayfa zemin rengine uysun
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    updateThemeButton();
    updateThemeColor();

    let currentFilter = 'all';
    let searchQuery = '';

    // Seçili dildeki alanı getirir; yoksa Türkçe'ye düşer (undefined hatasını önler)
    function pick(item, field) {
        const suffix = activeLang === 'en' ? 'En' : (activeLang === 'ar' ? 'Ar' : 'Tr');
        return item[field + suffix] || item[field + 'Tr'] || '';
    }

    function lower(s) {
        return String(s).toLocaleLowerCase(activeLang === 'tr' ? 'tr' : undefined);
    }

    // Listeyi Ekrana Basma (Çoklu Dil ve Arama Destekli)
    function renderList() {
        const listContainer = document.getElementById('contentList');
        listContainer.innerHTML = '';
        const q = lower(searchQuery.trim());

        const filtered = siyerData.filter(item => {
            const matchesCategory = (currentFilter === 'all' || item.category === currentFilter);
            const matchesSearch = !q ||
                lower(pick(item, 'title')).includes(q) ||
                lower(pick(item, 'desc')).includes(q) ||
                lower(pick(item, 'content')).includes(q);
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px; font-size:0.9rem;">' + t.no_result + '</div>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'siyer-card';
            card.onclick = () => openDetail(item.id);
            card.innerHTML = `
                <div class="siyer-card-title">
                    <span>${pick(item, 'title')}</span>
                    <span class="badge">${pick(item, 'badge')}</span>
                </div>
                <div class="siyer-card-desc">${pick(item, 'desc')}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function filterCategory(cat, btnElem) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        currentFilter = cat;
        renderList();
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        renderList();
    }

    function openDetail(id) {
        const item = siyerData.find(i => i.id === id);
        if (!item) return;

        document.getElementById('modalTitle').innerText = pick(item, 'title');
        document.getElementById('modalBody').innerText = pick(item, 'content');
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function closeModalOutside(e) {
        if (e.target.id === 'detailModal') closeModal();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });

    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        const si = document.getElementById('searchInput');
        if (si && t.search_ph) si.placeholder = t.search_ph;

        renderList();
    };
</script>
